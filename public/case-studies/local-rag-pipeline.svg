<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rag-pipe-title" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="rag-pipe-title">The path of one message: four gates, each with an exit to a human operator</title>

  <defs>
    <marker id="rag-freccia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d5c63" />
    </marker>
    <marker id="rag-freccia-grigia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#58606b" />
    </marker>
  </defs>

  <rect width="1000" height="660" fill="#ffffff" />

  <!-- Ingresso -->
  <rect x="170" y="20" width="260" height="44" rx="22" fill="#eef2f3" stroke="#d5dbdf" />
  <text x="300" y="47" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1e23">Student message on WhatsApp</text>

  <!-- Flusso principale -->
  <g stroke="#1d5c63" stroke-width="2" fill="none" marker-end="url(#rag-freccia)">
    <path d="M300 64V96" />
    <path d="M300 164V188" />
    <path d="M300 256V280" />
    <path d="M300 348V372" />
    <path d="M300 440V464" />
    <path d="M300 532V568" />
  </g>

  <!-- Uscite verso l'operatore -->
  <g stroke="#58606b" stroke-width="1.5" fill="none" marker-end="url(#rag-freccia-grigia)">
    <path d="M470 132H636" />
    <path d="M470 224H636" />
    <path d="M470 316H636" />
    <path d="M470 408H636" />
    <path d="M470 500H636" />
  </g>
  <g font-size="11.5" fill="#58606b" text-anchor="middle">
    <text x="553" y="124">unreliable split</text>
    <text x="553" y="216">never-automatic topic</text>
    <text x="553" y="308">not found</text>
    <text x="553" y="400">any claim fails</text>
    <text x="553" y="492">no</text>
  </g>
  <text x="314" y="555" font-size="11.5" fill="#1d5c63" font-weight="700">yes</text>

  <!-- 1 Scomposizione -->
  <rect x="130" y="100" width="340" height="64" rx="10" fill="#ffffff" stroke="#1d5c63" stroke-width="1.25" />
  <circle cx="162" cy="132" r="15" fill="#1d5c63" />
  <text x="162" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="190" y="128" font-size="15" font-weight="700" fill="#1a1e23">Decomposition</text>
  <text x="190" y="147" font-size="11.5" fill="#58606b">splits into ≤ 4 questions · words checked</text>

  <!-- 2 Esclusione -->
  <rect x="130" y="192" width="340" height="64" rx="10" fill="#ffffff" stroke="#1d5c63" stroke-width="1.25" />
  <circle cx="162" cy="224" r="15" fill="#1d5c63" />
  <text x="162" y="229" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="190" y="220" font-size="15" font-weight="700" fill="#1a1e23">Exclusion</text>
  <text x="190" y="239" font-size="11.5" fill="#58606b">similarity to the never-automatic list</text>

  <!-- Ricerca e risposta vincolata (passo, non controllo) -->
  <rect x="130" y="284" width="340" height="64" rx="10" fill="#eef2f3" stroke="#d5dbdf" />
  <circle cx="162" cy="316" r="5" fill="#58606b" />
  <text x="190" y="312" font-size="15" font-weight="700" fill="#1a1e23">Retrieval + constrained answer</text>
  <text x="190" y="331" font-size="11.5" fill="#58606b">top 8 passages → claims with exact quotes</text>

  <!-- 3 Verifica -->
  <rect x="130" y="376" width="340" height="64" rx="10" fill="#ffffff" stroke="#1d5c63" stroke-width="1.25" />
  <circle cx="162" cy="408" r="15" fill="#1d5c63" />
  <text x="162" y="413" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="190" y="404" font-size="15" font-weight="700" fill="#1a1e23">Verification, no LLM</text>
  <text x="190" y="423" font-size="11.5" fill="#58606b">quote exists · numbers match · HHEM ≥ 0.50</text>

  <!-- 4 Approvazione -->
  <rect x="130" y="468" width="340" height="64" rx="10" fill="#ffffff" stroke="#1d5c63" stroke-width="1.25" />
  <circle cx="162" cy="500" r="15" fill="#1d5c63" />
  <text x="162" y="505" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="190" y="496" font-size="15" font-weight="700" fill="#1a1e23">Approval gate</text>
  <text x="190" y="515" font-size="11.5" fill="#58606b">≥ 0.90 to an approved answer, same passages</text>

  <!-- Operatore -->
  <rect x="640" y="100" width="320" height="340" rx="12" fill="#eef2f3" stroke="#d5dbdf" />
  <text x="800" y="252" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1e23">Operator</text>
  <text x="800" y="277" text-anchor="middle" font-size="12" fill="#58606b">a person answers from the phone</text>
  <text x="800" y="294" text-anchor="middle" font-size="12" fill="#58606b">or from the dashboard</text>
  <text x="800" y="330" text-anchor="middle" font-size="11.5" font-style="italic" fill="#1d5c63">if a person replies first, nothing is sent</text>

  <!-- Bozza -->
  <rect x="640" y="468" width="320" height="64" rx="10" fill="#ffffff" stroke="#1d5c63" stroke-width="1.25" />
  <text x="800" y="496" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1e23">Draft for the operator</text>
  <text x="800" y="515" text-anchor="middle" font-size="11.5" fill="#58606b">approve · edit · discard</text>
  <text x="800" y="553" text-anchor="middle" font-size="11.5" fill="#1d5c63">each approval widens what can be automatic</text>

  <!-- Risposta automatica -->
  <rect x="130" y="572" width="340" height="64" rx="10" fill="#133f44" />
  <text x="300" y="600" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Automatic reply</text>
  <text x="300" y="619" text-anchor="middle" font-size="11.5" fill="#ffffff" fill-opacity="0.85">verified quotes only + AI disclosure line</text>

  <!-- Registro -->
  <rect x="640" y="572" width="320" height="64" rx="10" fill="#ffffff" stroke="#d5dbdf" stroke-dasharray="4 3" />
  <text x="800" y="600" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1e23">Audit log</text>
  <text x="800" y="619" text-anchor="middle" font-size="11.5" fill="#58606b">every decision recorded, on the office server</text>
</svg>
